    document.querySelector("#" + items[key].id + " .clickLabel").textContent = "0/" + items[key].max;

  function addPiece(name) {
    var data = items[name];
    var list = plans[name];
    if (data.clicks >= data.max) return;
    var index = data.clicks;
    if (index >= list.length) return;
    var stack = document.querySelector("#" + data.id + " .stack");
    var d = document.createElement("div");
    d.className = "piece";
    d.style.cssText = list[index];
    stack.appendChild(d);
    data.clicks += 1;
    document.querySelector("#" + data.id + " .clickLabel").textContent = data.clicks + "/" + data.max;
    if (data.clicks >= data.max) {
      document.getElementById(data.id).classList.add("final-on");
    }
    checkDone();
  }

  function checkDone() {
    var all = true, total = 0;
    for (var k in items) {
      total += items[k].clicks;
      if (!items[k].placed || items[k].clicks < items[k].max) all = false;
    }
    if (total >= 20) {
      ["gSun", "gCloud1", "gCloud2", "gFlower1"].forEach(function(id) {
        document.getElementById(id).classList.remove("hidden-deco");
      });
    }
    if (total >= 40) {
      ["gFood", "gWater", "gYarn", "gBush1", "gBush2"].forEach(function(id) {
        document.getElementById(id).classList.remove("hidden-deco");
      });
    }
    if (all) {

    document.getElementById("huntRecord").textContent = "최고 기록: " + huntBest;
  }

  function gullHtml() {
    return '<div class="gull-wing"></div><div class="gull-body"></div><div class="gull-head"></div><div class="gull-beak"></div>';
  }

  function spawnGull() {
    if (!huntOn) return;
    var g = document.createElement("div");
    g.className = "gull";
    g.innerHTML = gullHtml();
    var fromLeft = Math.random() > 0.5;
    g.style.top = (70 + Math.random() * 280) + "px";
    if (fromLeft) {
      g.style.left = "-80px";
      g.dataset.dir = "1";
    } else {
      g.style.left = (window.innerWidth + 20) + "px";
      g.dataset.dir = "-1";
      g.classList.add("flip");
    }
    g.dataset.speed = String(6.5 + Math.random() * 4.5);
    document.getElementById("huntScreen").appendChild(g);
  }

  function moveGulls() {
    if (!huntOn) return;
    var list = document.querySelectorAll("#huntScreen .gull");
    list.forEach(function(g) {
      if (g.classList.contains("fall")) return;
      var x = parseFloat(g.style.left) || 0;
      var dir = parseFloat(g.dataset.dir);
      var speed = parseFloat(g.dataset.speed);
      x += dir * speed * huntSpeedMul;
      g.style.left = x + "px";
      if (x > window.innerWidth + 100 || x < -120) {
        g.remove();
        if (huntOn) {
          huntMiss += 1;
          document.getElementById("huntMiss").textContent = "놓친 새: " + huntMiss + "/5";
          if (huntMiss >= 5) endHuntRound();
        }
      }
    });
  }

  function nyanPunch(x) {
    var rect = document.getElementById("huntScreen").getBoundingClientRect();
    var paw = (x < rect.left + rect.width / 2)
      ? document.getElementById("leftPaw")
      : document.getElementById("rightPaw");
    paw.classList.remove("punch");
    void paw.offsetWidth;
    paw.classList.add("punch");
    clearTimeout(pawReset);
    pawReset = setTimeout(function() {
      paw.classList.remove("punch");
    }, 280);
  }

    var list = document.querySelectorAll("#huntScreen .gull");
    var best = null;
    var bestDist = 9999;
    for (var i = 0; i < list.length; i++) {
      var g = list[i];
      if (g.classList.contains("fall")) continue;
      var r = g.getBoundingClientRect();
      var cx = r.left + r.width / 2;
      var cy = r.top + r.height / 2;
      var dx = x - cx;
      var dy = y - cy;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < bestDist) {
        bestDist = dist;
        best = g;
      }
    }
    if (best && bestDist <= 55) {
      best.classList.add("fall");
      huntScore += 100;
      document.getElementById("huntScoreCenter").textContent = huntScore;
      setTimeout(function() { if (best.parentNode) best.remove(); }, 750);
    }
  }

  function openHuntScreen() {
    huntOn = false;
    huntReady = false;
    document.getElementById("gameScreen").style.display = "none";
    document.getElementById("huntScreen").style.display = "block";
    document.getElementById("huntStartWrap").classList.add("show");
    document.getElementById("huntEndWrap").classList.remove("show");
    document.querySelectorAll("#huntScreen .gull").forEach(function(g) { g.remove(); });
    document.getElementById("huntScoreCenter").textContent = "0";
    document.getElementById("huntMiss").textContent = "놓친 새: 0/5";
    showHuntRecord();
    clearInterval(huntTimer);
    clearInterval(huntMove);
    clearInterval(huntSpeedTimer);
  }

  function startHuntRound() {
    huntOn = true;
    huntReady = true;
    huntScore = 0;
    huntMiss = 0;
    document.getElementById("huntScoreCenter").textContent = "0";
    document.getElementById("huntMiss").textContent = "놓친 새: 0/5";
    document.getElementById("huntStartWrap").classList.remove("show");
    document.getElementById("huntEndWrap").classList.remove("show");
    document.querySelectorAll("#huntScreen .gull").forEach(function(g) { g.remove(); });
    huntSpeedMul = 1;
    spawnGull();
    spawnGull();
    clearInterval(huntTimer);
    clearInterval(huntMove);
    clearInterval(huntSpeedTimer);
    huntTimer = setInterval(spawnGull, 700);
    huntMove = setInterval(moveGulls, 16);
    huntSpeedTimer = setInterval(function() {
      huntSpeedMul += 0.25;
    }, 2500);
  }

  function endHuntRound() {
    if (!huntOn) return;
    huntOn = false;
    clearInterval(huntTimer);
    clearInterval(huntMove);
    clearInterval(huntSpeedTimer);
    document.querySelectorAll("#huntScreen .gull").forEach(function(g) { g.remove(); });
    var text = "게임 끝!";
    if (huntScore > huntBest) {
      huntBest = huntScore;
      try { localStorage.setItem("catHuntBest", String(huntBest)); } catch (e) {}
      text = "신기록!";
    }
    showHuntRecord();
    document.getElementById("huntEndText").textContent = text;
    document.getElementById("huntEndScore").textContent = "이번 점수: " + huntScore;
    document.getElementById("huntEndWrap").classList.add("show");
  }

  function stopHunt() {
    huntOn = false;
    clearInterval(huntTimer);
    clearInterval(huntMove);
    clearInterval(huntSpeedTimer);
    document.querySelectorAll("#huntScreen .gull").forEach(function(g) { g.remove(); });
    document.getElementById("huntScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";
    document.getElementById("doneMsg").style.display = "none";
  }

  document.getElementById("huntBtn").addEventListener("click", function(e) {
    e.stopPropagation();
    openHuntScreen();
  });

  document.getElementById("huntStartBtn").addEventListener("click", function(e) {
    e.stopPropagation();
    startHuntRound();
  });

  document.getElementById("huntRetryBtn").addEventListener("click", function(e) {
    e.stopPropagation();
    document.getElementById("huntEndWrap").classList.remove("show");
    document.getElementById("huntStartWrap").classList.add("show");
  });

  document.getElementById("backYard").addEventListener("click", function(e) {
    e.stopPropagation();
    stopHunt();
  });

  document.getElementById("huntScreen").addEventListener("mousedown", function(e) {
    if (!huntOn) return;
    if (e.target.closest("#huntHud")) return;
    e.preventDefault();
    nyanPunch(e.clientX);
    catchNearestGull(e.clientX, e.clientY);
  });

  document.querySelectorAll("#shopBar button").forEach(function(btn) {
    btn.addEventListener("click", function() {
      var name = btn.getAttribute("data-place");
      var data = items[name];
      if (data.placed) return;
      data.placed = true;
      document.getElementById(data.id).style.display = "block";
      addPiece(name);
      btn.disabled = true;
      btn.textContent = "놓음!";
    });
  });

  ["tower", "hide", "scratch", "litter"].forEach(function(name) {
    document.getElementById(items[name].id).addEventListener("click", function() {
      addPiece(name);
    });
  });

  document.getElementById("startText").addEventListener("click", function() {
    var startScreen = document.getElementById("startScreen");
    startScreen.classList.add("fade-out");
    setTimeout(function() {
      startScreen.style.display = "none";
      document.getElementById("gameScreen").style.display = "block";
    }, 1000);
  });
</script>
</body>
</html>
